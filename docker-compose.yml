version: "3"
services:
  mongo:
    image: mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    restart: always
    volumes:
      - ./mongo_db:/data/db
    ports:
      - 27017:27017
  bot:
    # build from scratch or use my image
    build:
      context: .
    # image: alikhil/tic-tac-toe-telegram-bot:0.1
    environment:
      TOKEN: ${TELEGRAM_BOT_TOKEN}
      SSL_CERT_FILE: /run/erebor-ca.pem
      SSL_CERT_DIR: /nonexistent
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/run/erebor-ca.pem:ro

    restart: always
